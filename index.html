<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Follow Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Instagram Follow Checker</h1>
        <p class="subtitle">
            Find people you follow who don't follow you back.
        </p>

        <div class="upload-box">
            <label>Select your JSON files (followers_1.json and following.json)</label>
            <input type="file" id="jsonFiles" accept=".json" multiple>

            <button id="checkBtn">Check</button>
        </div>

        <div id="stats" class="stats"></div>

        <div class="result">
            <h2>Not Following You Back</h2>
            <div id="results"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
